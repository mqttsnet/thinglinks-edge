# ThingLinks Edge —— 单机部署
#
#   cp .env.example .env      # 至少填 EXTERNAL_URL 与 MASTER_KEY
#   docker compose up -d
#   打开 EXTERNAL_URL —— 全新部署会让你**当场设置**管理员账号与口令。
#   口令由你自己定，不落日志（认领窗口默认 30 分钟，见 SETUP_WINDOW_MIN）。
#
# Manager 以**兄弟容器**模式管理 Node-RED 实例：实例是宿主上的独立容器，
# 不是 Manager 的子进程。升级 Manager（docker compose pull && up -d）
# 不会中断现场采集 —— 产线不会为了升级管理台而停止采集。

# EDGE_NAME_PREFIX 只为「同机并行跑两套」而存在（例如现场栈开着、同时跑验证）。
# 默认值与固定命名完全一致，生产不需要设置它。
services:
  # 受限 docker 端点。Manager 不再接触宿主 socket —— 它只能通过这里，
  # 而这里只放行下面白名单里的十几条 API。
  #
  # 为什么不是 tecnativa/docker-socket-proxy：那个按「分区」开关（POST=1 一把全开），
  # 这个能按方法逐条正则白名单，和本项目 container-spec 的硬白名单是同一套思路。
  #
  # 正则用 YAML **单引号**标量：双引号标量会解释 \. \? 并报
  # found unknown escape character。行尾的 $$ 是防御写法 —— compose 只在 $ 后面
  # 跟标识符或 { 时才插值（实测 ^abc$FOO 到容器里会变成 ^abc），孤立的行尾 $ 本身安全。
  docker-proxy:
    # 参数化是为了两件事：离线包要把镜像改名后随包发（见 scripts/build-offline-bundle.sh），
    # 以及现场把镜像同步到内网仓库时不必改这个文件
    image: ${PROXY_IMAGE:-wollomatic/socket-proxy:1.13.1}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-docker-proxy
    restart: unless-stopped
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=${EDGE_NAME_PREFIX:-thinglinks-edge}-manager
      - -allowhealthcheck
      - -watchdoginterval=30
      - -stoponwatchdog
      # images/json 与 images/<name>/json 是**只读**的：只能看本机有哪些镜像，
      # 不能拉取（images/create 仍未放行）也不能删除。放行它是为了让 Manager
      # 能在建实例前判断镜像在不在 —— 否则只能等 containers/create 回 404
      # 名字里允许 / 与 :（nodered/node-red:5.0.4-…），但必须以 /json 结尾，只能查不能改
      #
      # `info` 是安装自检要的：架构匹配与 cgroup 内存限额两项只能从它读。
      # 它是纯只读的守护进程元信息（版本、架构、cgroup、存储驱动、容器计数），
      # 敏感度低于已经放行的 containers/json —— 不放行的话那两项在装完之后
      # 永远报「读不到 docker info」，而现场恰恰要靠它们发现「限额配了不生效」。
      # 「No such image」，那句话对现场人员毫无指导意义。
      - '-allowGET=^(/v1\.[0-9]+)?/(_ping|version|info|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs|stats)|images/json|images/[a-zA-Z0-9][a-zA-Z0-9_.:@/-]*/json|volumes/[a-zA-Z0-9][a-zA-Z0-9_.-]*|networks)(\?.*)?$$'
      - '-allowPOST=^(/v1\.[0-9]+)?/(containers/create|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart)|networks/create|networks/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(connect|disconnect)|volumes/create)(\?.*)?$$'
      - '-allowPUT=^(/v1\.[0-9]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/archive(\?.*)?$$'
      - '-allowDELETE=^(/v1\.[0-9]+)?/(containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*|networks/[a-zA-Z0-9][a-zA-Z0-9_.-]*|volumes/[a-zA-Z0-9][a-zA-Z0-9_.-]*)(\?.*)?$$'
    volumes:
      # 只读挂载：代理自己也不需要写 socket 文件本身。
      # 路径可配是为了 rootless Docker —— 它的 socket 在 $XDG_RUNTIME_DIR/docker.sock
      # 而不是 /var/run。写死会让 rootless 环境挂上一个不存在的路径，
      # 而 docker 会**自动建一个同名空目录**顶上去，于是代理启动后一直连不上，
      # 报错却是「connection refused」，看不出根因是挂错了。
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # 访问 docker.sock 需要加入其属组。查本机取值： stat -c '%g' /var/run/docker.sock
    # 特权集中在这个十几 MB 的 distroless 小程序上，而不是 Manager 那个 Node 应用
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - edge-docker
    read_only: true
    security_opt:
      - no-new-privileges:true

  # 首次启动准备宿主数据根。Docker 自动创建缺失的 bind 源目录时属主是 root:root，
  # 而 Manager 与 Node-RED 都以 uid 1000 运行 —— 不先摆平属主，第一次启动就写不进去，
  # 且表现是「容器起来了但建实例失败」而不是明确的挂载错误。
  # 以 root 跑一次即退出，Manager 等它成功后再起。
  init-data:
    image: ${INIT_IMAGE:-alpine:3.22}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-init-data
    user: "0:0"
    command: >
      sh -c 'mkdir -p /data-root/manager /data-root/instances
      && chown -R 1000:1000 /data-root
      && chmod 0770 /data-root/manager /data-root/instances'
    volumes:
      - ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}:/data-root
    restart: "no"

  manager:
    # 公开镜像：现场机器只要装了 docker，`docker compose up -d` 就直接拉起来跑 ——
    # 不需要克隆源码，也不需要装 Node/pnpm。镜像是多架构清单（amd64 + arm64），
    # x86 工控机和 ARM 盒子敲同一条命令，docker 自己挑对应那一份。
    #
    # 改了代码想跑自己编的镜像时，叠加构建覆盖文件（见 docker-compose.build.yml）：
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    #
    # 这里刻意钉死版本号而不用 latest：现场升级必须是一次**明确的**动作。
    # latest 会让 `docker compose pull` 在任何时候悄悄换掉底下的东西，
    # 而边缘现场最不能接受的就是「没人动过它，但它变了」。
    image: ${MANAGER_IMAGE:-mqttsnet/thinglinks-edge:1.0.1}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-manager
    restart: unless-stopped

    environment:
      # 唯一真源：所有对外链接、跳转与 Cookie 策略都由它派生，程序绝不猜自己的外部地址
      EXTERNAL_URL: ${EXTERNAL_URL:?必须设置，例如 http://192.168.10.20:19100}
      # 实例凭据的加密主密钥。缺失时进程拒绝启动，不会静默回落默认值
      MASTER_KEY: ${MASTER_KEY:?必须设置，可用 openssl rand -hex 32 生成}
      # 显式给容器名，不要依赖回退。Manager 要把自己接入每个实例的独立网络，
      # 未配置时它退回读 hostname；compose 不设 hostname 时那正好是容器短 id，
      # network connect 也认，于是「碰巧能用」—— 但只要这里加了 hostname:，
      # 或换了编排方式，接入就会失败，且表现是反代 502 而不是启动报错。
      # 见 index.ts 的 resolveManagerContainer
      MANAGER_CONTAINER: ${EDGE_NAME_PREFIX:-thinglinks-edge}-manager
      INSTANCE_NETWORK: ${INSTANCE_NETWORK:-thinglinks-edge}
      INSTANCE_PORT_MIN: ${INSTANCE_PORT_MIN:-30000}
      INSTANCE_PORT_MAX: ${INSTANCE_PORT_MAX:-30999}
      ALLOWED_IMAGE_TAGS: ${ALLOWED_IMAGE_TAGS:-5.0.4-24-minimal,4.1.13-22-minimal}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 宿主持久化根。Manager 自己的库与全部实例数据都在这下面，排障只看这一处。
      # 必须与下面 volumes 的挂载点同名 —— Manager 用容器内视角 mkdir，
      # 而 daemon 用宿主视角解析实例的 Binds，路径一致才不需要翻译。
      EDGE_DATA_ROOT: ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}
      # 时区。Manager 自己和它创建的每个 Node-RED 实例都用这个值 ——
      # 官方镜像默认 UTC，不设的话定时流程、班次判断、日志时间戳整体偏移且不报错
      TZ: ${TZ:-Asia/Shanghai}
      # 升级检查。留空即完全不联网（默认）—— 见 .env.example 的说明
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}
      # 出网代理（03 号文 2.10）。只有企业代理能出网的现场才需要填；离线部署留空。
      # NO_PROXY 里的内部条目由平台注入实例时自动补齐，这里填企业网管给的那份即可 ——
      # 但宿主上手动跑的 curl / npm / docker 用的是这份，别漏了内网段
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      #
      # NO_PROXY 的内部条目**必须在这里补**，不能只靠部署方填。
      #
      # Manager 自己的内部调用也走 Node 的 HTTP 客户端：连受限 docker 代理、
      # 反代到实例、应用层探针，全是 HTTP。配了 HTTP_PROXY 而 NO_PROXY 没写这些名字，
      # 它们会被一并送去企业代理 —— 实测表现是「创建实例失败：无法查询镜像…
      # connect ECONNREFUSED 127.0.0.1:7890」，看起来完全像 docker 端点坏了。
      #
      # 固定条目写在前面、部署方那份接在后面：顺序不影响匹配，但这样
      # NO_PROXY 为空时也不会出现前导逗号。
      NO_PROXY: localhost,127.0.0.1,::1,${EDGE_NAME_PREFIX:-thinglinks-edge}-manager,${EDGE_NAME_PREFIX:-thinglinks-edge}-docker-proxy,tle-nr-,${INSTANCE_NETWORK:-thinglinks-edge},${NO_PROXY:-localhost}
      # 企业内网网段，供自检比对 Docker 网段冲突（03 号文 2.9）
      CORPORATE_CIDRS: ${CORPORATE_CIDRS:-}
      # 健康监测趋势曲线的采样间隔（秒）。0 关闭采样，界面会明说趋势未启用。
      # 历史只存内存：重启即清零，换来的是不去磨盒子的 SD 卡
      EDGE_METRICS_INTERVAL_SEC: ${EDGE_METRICS_INTERVAL_SEC:-10}
      # 受限代理的地址。显式解析，配错了直接启动报错而不是悄悄回落到裸 socket
      DOCKER_HOST: tcp://${EDGE_NAME_PREFIX:-thinglinks-edge}-docker-proxy:2375

    ports:
      # 默认只发布到回环：现场要外部可达时改成 "0.0.0.0:19100:19100"，
      # 或（推荐）由前面的企业反代转发过来
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-19100}:19100"

    volumes:
      # 同名挂载：容器内路径 == 宿主路径。Manager 要 mkdir/删除实例数据目录（容器内视角），
      # 同时要把同一路径写进实例容器的 Binds 交给 daemon 解析（宿主视角）。
      # 两边同名就不存在翻译，也就不会出现「以为建好了、实际挂到别处」的静默错挂。
      - ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}:${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}
      # 没有 docker.sock —— Manager 够不到宿主 docker 端点，只能走受限代理

    networks:
      - edge-docker

    depends_on:
      docker-proxy:
        condition: service_started
      init-data:
        condition: service_completed_successfully

    # 只读根文件系统：可写的地方只有数据目录与 tmpfs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  # 只有 Manager 与代理在这张网上；实例各有各的网络，够不到代理
  edge-docker:
    name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-docker
