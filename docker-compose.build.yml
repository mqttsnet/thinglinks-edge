# 本地源码构建覆盖文件 —— 只有开发者需要它。
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 为什么单独拆一个文件，而不是在 docker-compose.yml 里同时写 build 和 image：
# 主文件一旦带 build 段，`docker compose pull` 对该服务的行为就变得含糊
# （它会认为这个服务归你自己构建），而现场升级走的正是 pull。
# 主文件保持「纯拉取」，构建能力放在这里叠加，两条路径各自干净。
#
# Manager 仍使用主文件的镜像引用。独立策略镜像未设置 POLICY_IMAGE 时使用
# thinglinks-edge-policy:dev；启动时继续带本覆盖文件，或将对应镜像写入 .env。
x-policy-build: &policy-build
  context: .
  dockerfile: apps/manager/Dockerfile.policy
  args:
    IMAGE_VERSION: dev

services:
  # Build the privileged helpers as a separate image. The main compose file
  # keeps its published-image defaults for normal upgrades; this override is
  # the reproducible local-source path and never tags the result as Manager.
  # Both roles deliberately share POLICY_IMAGE here. Separate PROXY_IMAGE and
  # NETWORK_IMAGE overrides remain available in the image-only main file, but
  # must not make Compose build two distinct service-labelled policy artifacts.
  network-isolation:
    build: *policy-build
    image: ${POLICY_IMAGE:-thinglinks-edge-policy:dev}

  docker-proxy:
    build: *policy-build
    image: ${POLICY_IMAGE:-thinglinks-edge-policy:dev}

  manager:
    build:
      context: .
      dockerfile: apps/manager/Dockerfile
      args:
        IMAGE_VERSION: dev
    image: ${MANAGER_IMAGE:-mqttsnet/thinglinks-edge:1.0.1}
