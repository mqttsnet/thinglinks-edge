# ThingLinks Edge —— 单机部署
#
#   只需填写下面两项：访问地址、自己的初始管理员密码（至少 12 位）。
#   docker compose up -d
#   打开该地址，用 admin 和上述密码登录。无需创建 .env、生成密钥或手动拉 Node-RED。
#   已有管理员的升级不重置密码，也不要求再次填写初始密码。配置文件请妥善保管。
#
# Manager 以**兄弟容器**模式管理 Node-RED 实例：实例是宿主上的独立容器，
# 不是 Manager 的子进程。升级 Manager（docker compose pull && up -d）
# 不会中断现场采集 —— 产线不会为了升级管理台而停止采集。

x-external-url: &external-url ${EXTERNAL_URL:-http://localhost:19100}
# 在引号中填写自己的密码；若密码含 $，在 Compose 中写成 $$。
x-initial-password: &initial-password ""

# EDGE_NAME_PREFIX 只为「同机并行跑两套」而存在（例如现场栈开着、同时跑验证）。
# 默认值与固定命名完全一致，生产不需要设置它。
services:
  # 可信网络保护组件：只给它 NET_ADMIN，业务 Node-RED 实例不获得该权限。
  # POLICY_IMAGE 应是只包含策略/防火墙入口的最小镜像，不应复用 Manager 业务镜像。
  # 未显式设置时暂时回退 MANAGER_IMAGE 只为兼容旧现场；新部署和升级必须在
  # .env 中填写与发行包配套的策略镜像。构建覆盖文件会自动使用本地 policy:dev。
  # 首次部署应确认宿主支持已验证的 iptables(nf_tables) 后端；不支持时不会放行新实例。
  network-isolation:
    image: ${NETWORK_IMAGE:-${POLICY_IMAGE:-${MANAGER_IMAGE:-mqttsnet/thinglinks-edge:1.0.1}}}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-network-isolation
    command: ["node", "dist/network-isolation-main.js"]
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      TLE_NET_CONTROL_SOCKET: /run/tle-network/control.sock
      TLE_NET_STATE_DIR: /run/tle-network/state
      TLE_NET_HEALTH_HOST: 0.0.0.0
      TLE_NET_HEALTH_PORT: ${NETWORK_HEALTH_PORT:-31555}
      TLE_NET_EXTRA_PROTECTED_HOSTS: ${PROTECTED_HOST_IPS:-}
    volumes:
      - edge-network-control:/run/tle-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${TLE_NET_HEALTH_PORT}/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # 独立 Docker 执行策略服务。只有它持有 socket；请求体、资源归属及镜像均需校验。
  # POLICY_IMAGE 应是只包含策略入口的最小镜像，不应复用 Manager 业务镜像。
  # 未显式设置时暂时回退 MANAGER_IMAGE 只为兼容旧现场，见上方说明。
  docker-proxy:
    image: ${PROXY_IMAGE:-${POLICY_IMAGE:-${MANAGER_IMAGE:-mqttsnet/thinglinks-edge:1.0.1}}}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-docker-proxy
    restart: unless-stopped
    command: ["node", "dist/docker-policy-main.js"]
    environment:
      TLE_POLICY_DATA_ROOT: ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}/instances
      TLE_POLICY_NETWORK_PREFIX: ${INSTANCE_NETWORK:-thinglinks-edge}
      TLE_POLICY_MANAGER_CONTAINER: ${EDGE_NAME_PREFIX:-thinglinks-edge}-manager
      TLE_POLICY_IMAGE_REPO: ${NODE_RED_IMAGE_REPO:-nodered/node-red}
      TLE_POLICY_ALLOWED_TAGS: ${ALLOWED_IMAGE_TAGS:-5.0.7-24-minimal,5.0.4-24-minimal,4.1.13-22-minimal}
      TLE_POLICY_PORT_MIN: ${INSTANCE_PORT_MIN:-30000}
      TLE_POLICY_PORT_MAX: ${INSTANCE_PORT_MAX:-30999}
      TLE_POLICY_NETWORK_SOCKET: /run/tle-network/control.sock
      TLE_POLICY_NETWORK_HEALTH_PORT: ${NETWORK_HEALTH_PORT:-31555}
      TLE_POLICY_STATE_ROOT: /var/lib/tle-policy
      TLE_POLICY_PROTECTED_HOSTS: ${PROTECTED_HOST_IPS:-}
      TLE_POLICY_ALLOWED_HOST_ENDPOINTS: '${ALLOWED_HOST_ENDPOINTS:-[]}'
      TLE_POLICY_MANAGER_PORT: ${HOST_PORT:-19100}
      TLE_POLICY_EDITOR_PORT_MIN: ${EDITOR_PORT_MIN:-19200}
      TLE_POLICY_EDITOR_PORT_MAX: ${EDITOR_PORT_MAX:-19263}
    volumes:
      # socket 的 ro 挂载不是 Docker API 只读授权；授权由执行策略校验。
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}/instances:${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}/instances:ro
      - edge-network-control:/run/tle-network
      - edge-policy-state:/var/lib/tle-policy
    user: "0:0"
    cap_drop: [ALL]
    networks: [edge-docker]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      network-isolation:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # 首次启动准备宿主数据根。Docker 自动创建缺失的 bind 源目录时属主是 root:root，
  # 而 Manager 与 Node-RED 都以 uid 1000 运行 —— 不先摆平属主，第一次启动就写不进去，
  # 且表现是「容器起来了但建实例失败」而不是明确的挂载错误。
  # 以 root 跑一次即退出，Manager 等它成功后再起。
  init-data:
    image: ${INIT_IMAGE:-alpine:3.22}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-init-data
    user: "0:0"
    command: >
      sh -c 'mkdir -p /data-root/manager /data-root/instances
      && chown -R 1000:1000 /data-root
      && chmod 0770 /data-root/manager /data-root/instances'
    volumes:
      - ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}:/data-root
    restart: "no"
    # 只处理本地 bind mount，完全不需要网络；同时避免 Compose 为它
    # 额外创建一张无用 default bridge，边缘主机的默认地址池很有限。
    network_mode: none

  # Compose 自动拉取默认 Node-RED 镜像；一次性检查退出后 Manager 才启动。
  # 这个容器不运行 Node-RED、不挂载实例数据、不连接任何网络。
  node-red-image:
    image: ${NODE_RED_BOOTSTRAP_IMAGE:-${NODE_RED_IMAGE_REPO:-nodered/node-red}:5.0.7-24-minimal}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-node-red-image
    entrypoint: ["node", "-e", "process.exit(0)"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  manager:
    # 公开镜像：现场机器只要装了 docker，`docker compose up -d` 就直接拉起来跑 ——
    # 不需要克隆源码，也不需要装 Node/pnpm。镜像是多架构清单（amd64 + arm64），
    # x86 工控机和 ARM 盒子敲同一条命令，docker 自己挑对应那一份。
    #
    # 改了代码想跑自己编的镜像时，叠加构建覆盖文件（见 docker-compose.build.yml）：
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    #
    # 这里刻意钉死版本号而不用 latest：现场升级必须是一次**明确的**动作。
    # latest 会让 `docker compose pull` 在任何时候悄悄换掉底下的东西，
    # 而边缘现场最不能接受的就是「没人动过它，但它变了」。
    image: ${MANAGER_IMAGE:-mqttsnet/thinglinks-edge:1.0.1}
    container_name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-manager
    restart: unless-stopped

    environment:
      # 唯一真源：所有对外链接、跳转与 Cookie 策略都由它派生，程序绝不猜自己的外部地址
      EXTERNAL_URL: *external-url
      # 首次生成独立的 0600 密钥文件；后续启动复用，已有数据时绝不重新生成。
      # 旧 .env 中的 MASTER_KEY 会保留加密身份并写入文件；不在日志中输出密钥。
      MASTER_KEY: ${MASTER_KEY:-}
      MASTER_KEY_FILE: ${MASTER_KEY_FILE:-${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}/.master.key}
      # 旧 .env 的 INITIAL_PASSWORD 优先；普通用户只编辑顶部的密码即可。
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-}
      COMPOSE_INITIAL_PASSWORD: *initial-password
      # 默认禁止对网络开放匿名首次认领；无初始密码的新部署不会开始监听。
      ADMIN_SETUP_MODE: ${ADMIN_SETUP_MODE:-password}
      SETUP_WINDOW_MIN: ${SETUP_WINDOW_MIN:-0}
      SETUP_INSTALL_TOKEN: ${SETUP_INSTALL_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # 显式给容器名，不要依赖回退。Manager 要把自己接入每个实例的独立网络，
      # 未配置时它退回读 hostname；compose 不设 hostname 时那正好是容器短 id，
      # network connect 也认，于是「碰巧能用」—— 但只要这里加了 hostname:，
      # 或换了编排方式，接入就会失败，且表现是反代 502 而不是启动报错。
      # 见 index.ts 的 resolveManagerContainer
      MANAGER_CONTAINER: ${EDGE_NAME_PREFIX:-thinglinks-edge}-manager
      INSTANCE_NETWORK: ${INSTANCE_NETWORK:-thinglinks-edge}
      INSTANCE_PORT_MIN: ${INSTANCE_PORT_MIN:-30000}
      INSTANCE_PORT_MAX: ${INSTANCE_PORT_MAX:-30999}
      NODE_RED_IMAGE_REPO: ${NODE_RED_IMAGE_REPO:-nodered/node-red}
      ALLOWED_IMAGE_TAGS: ${ALLOWED_IMAGE_TAGS:-5.0.7-24-minimal,5.0.4-24-minimal,4.1.13-22-minimal}
      # Public product identity. These values are independent of device/business configuration.
      PRODUCT_NAME: ${PRODUCT_NAME-ThingLinks Edge}
      PRODUCT_TAGLINE: ${PRODUCT_TAGLINE-边缘计算网关}
      PRODUCT_DESCRIPTION: ${PRODUCT_DESCRIPTION-连接现场设备，编排采集流程，与云端协同运行。}
      PRODUCT_LOGO_URL: ${PRODUCT_LOGO_URL-product-logo.svg}
      PRODUCT_COPYRIGHT_START_YEAR: ${PRODUCT_COPYRIGHT_START_YEAR-2019}
      PRODUCT_COPYRIGHT_OWNER: ${PRODUCT_COPYRIGHT_OWNER-MqttsNet}
      PRODUCT_COMMUNITY_NAME: ${PRODUCT_COMMUNITY_NAME-MqttsNet 社区}
      PRODUCT_COMMUNITY_URL: ${PRODUCT_COMMUNITY_URL-https://mqttsnet.com}
      PRODUCT_GITHUB_REPOSITORY: ${PRODUCT_GITHUB_REPOSITORY-mqttsnet/thinglinks-edge}
      PRODUCT_DOCS_URL: ${PRODUCT_DOCS_URL-auto}
      PRODUCT_LICENSE: ${PRODUCT_LICENSE-Apache-2.0}
      PRODUCT_RELEASES_ENABLED: ${PRODUCT_RELEASES_ENABLED-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # 宿主持久化根。Manager 自己的库与全部实例数据都在这下面，排障只看这一处。
      # 必须与下面 volumes 的挂载点同名 —— Manager 用容器内视角 mkdir，
      # 而 daemon 用宿主视角解析实例的 Binds，路径一致才不需要翻译。
      EDGE_DATA_ROOT: ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}
      # 时区。Manager 自己和它创建的每个 Node-RED 实例都用这个值 ——
      # 官方镜像默认 UTC，不设的话定时流程、班次判断、日志时间戳整体偏移且不报错
      TZ: ${TZ:-Asia/Shanghai}
      # 升级检查。留空即完全不联网（默认）—— 见 .env.example 的说明
      UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}
      # 出网代理（03 号文 2.10）。只有企业代理能出网的现场才需要填；离线部署留空。
      #
      # 变量名**刻意加了 EDGE_ 前缀**，不直接读 HTTP_PROXY：
      # docker compose 的取值顺序是「shell 环境 > .env」，用标准名的话，
      # 谁在带代理的机器上敲了 `docker compose up`，谁的代理地址就被带进现场容器 ——
      # 而 .env 里明明写着留空。那种「配了不生效、没配反而生效」最难查。
      # 加前缀后，这台设备用不用代理只由 .env 决定，与执行者的 shell 无关。
      HTTP_PROXY: ${EDGE_HTTP_PROXY:-}
      # 只填了 HTTP 代理时 HTTPS 回落到它：不回落的话 https 请求会绕过代理直连，
      # 在只有代理能出网的现场表现为「升级检查一直超时」，而代理明明配了
      HTTPS_PROXY: ${EDGE_HTTPS_PROXY:-${EDGE_HTTP_PROXY:-}}
      #
      # NO_PROXY 的内部条目**必须在这里补**，不能只靠部署方填。
      #
      # Manager 自己的内部调用也走 Node 的 HTTP 客户端：连受限 docker 代理、
      # 反代到实例、应用层探针，全是 HTTP。配了 HTTP_PROXY 而 NO_PROXY 没写这些名字，
      # 它们会被一并送去企业代理 —— 实测表现是「创建实例失败：无法查询镜像…
      # connect ECONNREFUSED 127.0.0.1:7890」，看起来完全像 docker 端点坏了。
      #
      # 固定条目写在前面、部署方那份接在后面：顺序不影响匹配，但这样
      # NO_PROXY 为空时也不会出现前导逗号。
      NO_PROXY: localhost,127.0.0.1,::1,${EDGE_NAME_PREFIX:-thinglinks-edge}-manager,${EDGE_NAME_PREFIX:-thinglinks-edge}-docker-proxy,tle-nr-,${INSTANCE_NETWORK:-thinglinks-edge},${EDGE_NO_PROXY:-localhost}
      # 企业内网网段，供自检比对 Docker 网段冲突（03 号文 2.9）
      CORPORATE_CIDRS: ${CORPORATE_CIDRS:-}
      # 节点安装策略（01 号文 5.7）：
      #   allowlist  只能装控制台批准过的（默认，出厂即最严）；浏览器只加载私有 catalogue
      #   open       不限制，任何包都能装；浏览器同时加载官方公共 catalogue
      # 两种模式下实例 npm 下载仍经过 Manager registry，不把 catalogue 当 npm 源。
      # 这是安全闸门，刻意只放在编排文件里，不做成 Web 开关：改它应当有文件、有版本、有人 review
      EDGE_NODE_INSTALL_POLICY: ${EDGE_NODE_INSTALL_POLICY:-allowlist}
      # 私有节点源的上游。**留空 = 纯离线**：库里没有的包一律装不上，不去公网找。
      # 填了则库里没有时回源下载并顺手入库 —— 第一次装要联网，之后这个包永久离线可用。
      # 公网填 https://registry.npmjs.org ；内网有私服就填私服地址。
      # 走企业代理的现场只要配了 EDGE_HTTP_PROXY 即自动生效，这里不必重复配。
      EDGE_NPM_UPSTREAM: ${EDGE_NPM_UPSTREAM:-}
      # 点位历史条数上限。0 = 不记历史（最低配设备的退路）。
      # 按条数而不是天数封顶：边缘盒子的硬约束是磁盘与 SD 卡写入量，
      # 而同样保留 7 天，10 个点位和 500 个点位差两个数量级 —— 只有条数可预期。
      EDGE_HISTORY_MAX_ROWS: ${EDGE_HISTORY_MAX_ROWS:-500000}
      # 值没变时最长多久也留一个采样点（秒）。不留的话，恒定信号在图上是一条
      # 从远古拉过来的直线，区分不了「一直没变」和「早就没数据了」
      EDGE_HISTORY_MIN_GAP_SEC: ${EDGE_HISTORY_MIN_GAP_SEC:-300}
      # 健康监测趋势曲线的采样间隔（秒）。0 关闭采样，界面会明说趋势未启用。
      # 历史只存内存：重启即清零，换来的是不去磨盒子的 SD 卡
      EDGE_METRICS_INTERVAL_SEC: ${EDGE_METRICS_INTERVAL_SEC:-10}
      # 受限代理的地址。显式解析，配错了直接启动报错而不是悄悄回落到裸 socket
      EDITOR_PORT_MIN: ${EDITOR_PORT_MIN:-19200}
      EDITOR_PORT_MAX: ${EDITOR_PORT_MAX:-19263}
      DOCKER_HOST: tcp://${EDGE_NAME_PREFIX:-thinglinks-edge}-docker-proxy:2375

    ports:
      # 服务器可直接访问；放在宿主反代后时可用 BIND_ADDR=127.0.0.1。
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-19100}:19100"
      # 每个实例使用独立浏览器来源；端口一旦使用便保留，避免复用浏览器存储。
      - "${BIND_ADDR:-0.0.0.0}:${EDITOR_PORT_MIN:-19200}-${EDITOR_PORT_MAX:-19263}:${EDITOR_PORT_MIN:-19200}-${EDITOR_PORT_MAX:-19263}"

    volumes:
      # 同名挂载：容器内路径 == 宿主路径。Manager 要 mkdir/删除实例数据目录（容器内视角），
      # 同时要把同一路径写进实例容器的 Binds 交给 daemon 解析（宿主视角）。
      # 两边同名就不存在翻译，也就不会出现「以为建好了、实际挂到别处」的静默错挂。
      - ${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}:${EDGE_DATA_ROOT:-/data01/mqttsnet/thinglinks-edge}
      # 没有 docker.sock —— Manager 够不到宿主 docker 端点，只能走受限代理

    networks:
      - edge-docker

    depends_on:
      docker-proxy:
        condition: service_started
      init-data:
        condition: service_completed_successfully
      node-red-image:
        condition: service_completed_successfully

    # 只读根文件系统：可写的地方只有数据目录与 tmpfs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  edge-network-control:
    name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-network-control
  edge-policy-state:
    name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-policy-state

networks:
  # 只有 Manager 与代理在这张网上；实例各有各的网络，够不到代理
  edge-docker:
    name: ${EDGE_NAME_PREFIX:-thinglinks-edge}-docker
